<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Showdown</title>

		<script src="assets/phaser.min.js"></script>
		<script src="assets/phaser-plugin-isometric.min.js"></script>
		<!-- the game: order matters, the themes after js/theme.js, main.js last -->
		<script src="js/data.js"></script>
		<script src="js/state.js"></script>
		<script src="js/board.js"></script>
		<script src="js/play.js"></script>
		<script src="js/bot.js"></script>
		<script src="js/effects.js"></script>
		<script src="js/ambient.js"></script>
		<script src="js/menu.js"></script>
		<script src="js/theme.js"></script>
		<script src="js/drawkit.js"></script>
		<script src="js/soundkit.js"></script>
		<!-- the themes: the first one is the default -->
		<script src="themes/cyberpunk/graphics.js"></script>
		<script src="themes/cyberpunk/sounds.js"></script>
		<script src="themes/cyberpunk/theme.js"></script>
		<script src="js/main.js"></script>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="description" content="Showdown - a two-player isometric board game with switchable themes, built with Phaser." />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="viewport" content="user-scalable=0, initial-scale=1, minimum-scale=1, maximum-scale=1, width=device-width, minimal-ui=1">
		<style type="text/css">
			body {
				margin: 0px 0px 1px 0px; /* the extra 1px allows the iOS inner/outer check to work */
				overflow: hidden;        /* the game fills the window: no scrollbar for that 1px */
				background: #111111;
				font-family: Arial;
				font-size: 30px;
				color: #CCCCCC;
			}

			#loader {
				background: #111111;
			}
			.layer {
				width: 100%;
				height: 100%;
				position: absolute;
				top: 0;
				left: 0;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div id="loader" class="layer">
			<h3>loading...</h3>
		</div>
	</body>
</html>
